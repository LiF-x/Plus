[package]
name = "lifx-dispatcher"
version = "0.1.0"
edition = "2024"
description = "LiFx dispatcher daemon — federates Life is Feudal YO worlds for multi-server sector handoff (issue #47)."
license = "MIT"
publish = false

[[bin]]
name = "lifxd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "macros", "chrono"] }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
